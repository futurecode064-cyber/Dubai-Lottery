name: Build Lottery Neon Function
on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - '.github/workflows/lottery-function.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test_only_password
          POSTGRES_DB: lottery_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: functions/package.json
      - name: Install dependencies
        working-directory: functions
        run: npm install --no-audit --no-fund
      - name: Test permissions, accounting and scheduled publication
        working-directory: functions
        env:
          DATABASE_URL: postgres://postgres:test_only_password@localhost:5432/lottery_test
          LOTTERY_ADMIN_NAME: owner_test
          LOTTERY_ADMIN_PASSWORD: TestOnlyOwnerPassword123!
        run: npm run test:integration
      - name: Syntax check
        working-directory: functions
        run: node --check index.mjs
      - name: Install test browser
        working-directory: functions
        run: npx playwright install --with-deps chromium
      - name: Test result lifecycle and responsive UI
        working-directory: functions
        run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Dubai-Lottery-UI-checks
          path: functions/test-artifacts/
      - name: Build function
        working-directory: functions
        run: npm run build
      - name: Create deployment archive
        working-directory: functions
        run: zip -j lottery-function.zip dist/index.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: Dubai-Lottery-Neon-Function
          path: functions/lottery-function.zip
          if-no-files-found: error
      - name: Publish verified bundle
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f functions/dist/index.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish verified Neon bundle [skip ci]"
          git push
