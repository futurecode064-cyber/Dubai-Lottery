name: Build Lottery Neon Function
on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - '.github/workflows/lottery-function.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: functions/package.json
      - name: Install dependencies
        working-directory: functions
        run: npm install --no-audit --no-fund
      - name: Syntax check
        working-directory: functions
        run: node --check index.mjs
      - name: Build function
        working-directory: functions
        run: npm run build
      - name: Create deployment archive
        working-directory: functions
        run: zip -j lottery-function.zip dist/index.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: Dubai-Lottery-Neon-Function
          path: functions/lottery-function.zip
          if-no-files-found: error
