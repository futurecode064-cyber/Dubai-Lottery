name: Build Android preview
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'server/**'
      - 'tests/**'

  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Smoke test live service
        env:
          BASE_URL: https://br-morning-snow-b3say1da-lottery.compute.c-4.ap-southeast-1.aws.neon.tech
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 "$BASE_URL/health" | grep '"ok":true'
          curl --fail --silent --show-error --retry 3 "$BASE_URL/ready" | grep '"ok":true'
          curl --fail --silent --show-error --retry 3 "$BASE_URL/" | grep 'Dubai Lottery'
          curl --fail --silent --show-error --retry 3 "$BASE_URL/admin" | grep 'Dubai Lottery Admin'
          code="$(curl --silent --output /dev/null --write-out '%{http_code}' "$BASE_URL/api/state")"
          test "$code" = "401"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test core
        run: python3 -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tools
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Test mobile interface
        run: node tests/test_ui.cjs
      - name: Build preview APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Dubai-Lottery-preview-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
