name: Deploy Cloudflare Free-Play Demo
on:
  workflow_dispatch:
  push:
    branches: [cloudflare-hybrid]
    paths:
      - '.github/workflows/cloudflare-deploy.yml'
      - 'cloudflare/**'
      - 'android/**'
concurrency:
  group: cloudflare-freeplay-deploy
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Normalize and validate Cloudflare credentials
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import os, re
          values = {name: os.environ.get(name, '').strip() for name in ('CLOUDFLARE_API_TOKEN', 'CLOUDFLARE_ACCOUNT_ID')}
          if not all(values.values()):
              raise SystemExit('CLOUDFLARE_ACCESS=missing: both repository secrets are required')
          if not re.fullmatch(r'[0-9a-fA-F]{32}', values['CLOUDFLARE_ACCOUNT_ID']):
              raise SystemExit('CLOUDFLARE_ACCOUNT_ID must contain only the 32-character Account ID, without a label or command')
          if any(ch.isspace() for ch in values['CLOUDFLARE_API_TOKEN']):
              raise SystemExit('CLOUDFLARE_API_TOKEN must contain only the token, without a command')
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              for name, value in values.items():
                  print('::add-mask::' + value)
                  out.write(name + '=' + value + '\n')
          print('CLOUDFLARE_CREDENTIAL_FORMAT=valid')
          PYCODE
      - name: Verify Cloudflare access
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo 'CLOUDFLARE_ACCESS=missing'
            echo 'Required repository secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID'
            exit 2
          fi
          echo 'CLOUDFLARE_ACCESS=present'
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID" \
            | jq -e '.success == true' >/dev/null
      - name: Find or create free-play D1 database
        working-directory: cloudflare
        shell: bash
        run: |
          set -euo pipefail
          LIST="$(npx --yes wrangler@4 d1 list --json)"
          D1_DATABASE_ID="$(printf '%s' "$LIST" | jq -r '.[] | select(.name=="dubai-lottery-freeplay") | .uuid' | head -n1)"
          if [ -z "$D1_DATABASE_ID" ]; then
            CREATE="$(curl --fail --silent --show-error -X POST \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H 'Content-Type: application/json' \
              --data '{"name":"dubai-lottery-freeplay"}' \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database")"
            D1_DATABASE_ID="$(printf '%s' "$CREATE" | jq -r '.result.uuid // empty')"
          fi
          test -n "$D1_DATABASE_ID"
          echo "D1_DATABASE_ID=$D1_DATABASE_ID" >> "$GITHUB_ENV"
          sed -i "s/REPLACE_WITH_D1_DATABASE_ID/$D1_DATABASE_ID/" wrangler.toml
          echo 'D1_DATABASE=ready'
      - name: Apply D1 schema
        working-directory: cloudflare
        run: npx --yes wrangler@4 d1 execute dubai-lottery-freeplay --remote --file=schema.sql
      - name: Configure demo admin secret
        working-directory: cloudflare
        shell: bash
        run: |
          set -euo pipefail
          ADMIN_TOKEN="$(printf '%s' "${CLOUDFLARE_API_TOKEN}:dubai-lottery-freeplay-admin-v1" | sha256sum | awk '{print $1}')"
          printf '%s' "$ADMIN_TOKEN" | npx --yes wrangler@4 secret put ADMIN_TOKEN
          echo 'ADMIN_SECRET=configured'
      - name: Ensure free workers.dev subdomain
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import json, os, urllib.request, urllib.error
          account = os.environ['CLOUDFLARE_ACCOUNT_ID']
          url = f'https://api.cloudflare.com/client/v4/accounts/{account}/workers/subdomain'
          headers = {'Authorization': 'Bearer ' + os.environ['CLOUDFLARE_API_TOKEN'], 'Content-Type': 'application/json'}
          try:
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers)) as response:
                  existing = json.load(response)
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              existing = {}
          if not existing.get('result', {}).get('subdomain'):
              wanted = 'futurecode-dubai-' + account[:8]
              req = urllib.request.Request(url, data=json.dumps({'subdomain': wanted}).encode(), headers=headers, method='PUT')
              with urllib.request.urlopen(req) as response:
                  created = json.load(response)
              assert created['success'], 'workers.dev subdomain registration failed'
          print('WORKERS_SUBDOMAIN=ready')
          PYCODE
      - name: Deploy Worker
        working-directory: cloudflare
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy 2>&1 | tee /tmp/wrangler-deploy.log
          URL="$(grep -Eo 'https://[^ ]+\.workers\.dev' /tmp/wrangler-deploy.log | tail -n1)"
          test -n "$URL"
          case "$URL" in */) ;; *) URL="$URL/" ;; esac
          echo "WORKER_URL=$URL" >> "$GITHUB_ENV"
          echo "WORKER_URL=$URL"
      - name: Smoke test Worker
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 18 --retry-all-errors --retry-delay 5 --retry-max-time 120 "${WORKER_URL}health" | tee /tmp/health.json
          jq -e '.ok == true and .mode == "free-play"' /tmp/health.json >/dev/null
          curl --fail --silent --show-error --retry 18 --retry-all-errors --retry-delay 5 --retry-max-time 120 "${WORKER_URL}api/config" | tee /tmp/public.json
          jq -e '.mode == "free-play" and .redeemable == false' /tmp/public.json >/dev/null
      - name: Verify live player and admin operations
        run: python3 cloudflare/live_verify.py
      - name: Create owner demo access
        run: python3 cloudflare/prepare_demo_access.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build Cloudflare-connected APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug -PapiBase="$WORKER_URL"
      - uses: actions/upload-artifact@v4
        with:
          name: Dubai-Lottery-FreePlay-Cloudflare-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Encrypt demo access and this build's signing backup
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$(gradle --no-daemon -p android :app:signingReport | sed -n 's/^Store: //p' | head -n1)"
          test -f "$KEYSTORE_PATH"
          cp "$KEYSTORE_PATH" "$RUNNER_TEMP/private-backup/debug.keystore"
          tar -czf "$RUNNER_TEMP/private-backup.tar.gz" -C "$RUNNER_TEMP/private-backup" .
          mkdir -p "$RUNNER_TEMP/encrypted-backup"
          openssl rand -hex 32 > "$RUNNER_TEMP/backup-key.txt"
          openssl enc -aes-256-cbc -salt -pbkdf2 -in "$RUNNER_TEMP/private-backup.tar.gz" -out "$RUNNER_TEMP/encrypted-backup/owner-backup.enc" -pass file:"$RUNNER_TEMP/backup-key.txt"
          openssl pkeyutl -encrypt -pubin -inkey cloudflare/backup-public.pem -in "$RUNNER_TEMP/backup-key.txt" -out "$RUNNER_TEMP/encrypted-backup/key.enc" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Dubai-Lottery-Encrypted-Owner-Backup
          path: ${{ runner.temp }}/encrypted-backup/
          retention-days: 7
