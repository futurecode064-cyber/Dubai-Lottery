name: Deploy Cloudflare Free-Play Demo
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require Cloudflare credentials and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          ADMIN_TOKEN: ${{ secrets.CLOUDFLARE_DEMO_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$D1_DATABASE_ID"
          test -n "$ADMIN_TOKEN"
          sed -i "s/REPLACE_WITH_D1_DATABASE_ID/$D1_DATABASE_ID/" wrangler.toml
          printf '%s' "$ADMIN_TOKEN" | npx --yes wrangler secret put ADMIN_TOKEN
          npx --yes wrangler d1 execute dubai-lottery-freeplay --remote --file=schema.sql
          npx --yes wrangler deploy
