plugins { id 'com.android.application' }
def serverAddress = providers.gradleProperty('serverUrl').getOrElse('https://br-morning-snow-b3say1da-lottery.compute.c-4.ap-southeast-1.aws.neon.tech/')
if (!serverAddress.startsWith('https://') || !serverAddress.endsWith('/')) {
    throw new GradleException('serverUrl must be an HTTPS URL ending with /')
}
android {
    namespace 'com.futurecode.dubailottery'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'com.futurecode.dubailottery'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '0.3.0-preview'
        buildConfigField 'String', 'SERVER_URL', '"' + serverAddress.replace('\\', '\\\\').replace('"', '\\"') + '"'
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes {
        release { minifyEnabled false }
    }
}
