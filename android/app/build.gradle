plugins { id 'com.android.application' }
def apiAddress = providers.gradleProperty('apiBase').getOrElse('https://api.example.invalid/')
if (!apiAddress.startsWith('https://') || !apiAddress.endsWith('/')) {
    throw new GradleException('apiBase must be an HTTPS URL ending with /')
}
android {
    namespace 'com.futurecode.dubailottery'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'com.futurecode.dubailottery'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '0.4.0-freeplay-hybrid'
        buildConfigField 'String', 'API_BASE', '"' + apiAddress.replace('\\', '\\\\').replace('"', '\\"') + '"'
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes {
        release { minifyEnabled false }
    }
}
